name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique + tags : nécessaires pour retrouver le tag précédent (notes de release)
          fetch-depth: 0

      - name: Vérifier cohérence tag ↔ package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "✗ Le tag ($TAG_VERSION) ne correspond pas à package.json ($PKG_VERSION)" >&2
            echo "  Bumpe package.json avant de tagger." >&2
            exit 1
          fi
          echo "✓ Tag v$TAG_VERSION cohérent avec package.json"

      - name: Construire et signer le tarball de release
        # Clé Ed25519 privée (PEM) en secret du dépôt : sans elle, pas de release
        # (l'updater refuse toute archive non signée).
        env:
          HS_RELEASE_SIGNING_KEY: ${{ secrets.HS_RELEASE_SIGNING_KEY }}
          HS_REQUIRE_SIGNATURE: "1"
        run: bash scripts/make-release.sh "${GITHUB_REF_NAME#v}"

      - name: Notes de release (commits depuis le tag précédent)
        run: |
          # Tag v* le plus proche dans l'ascendance du tag publié (et non le 2e plus récent)
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-merges "$PREV_TAG..$GITHUB_REF_NAME" > /tmp/notes.md
            echo "## Commits depuis $PREV_TAG" > /tmp/release-notes.md
            cat /tmp/notes.md >> /tmp/release-notes.md
          else
            echo "Release initiale" > /tmp/release-notes.md
          fi
          printf '\n---\n_Notes generees automatiquement - modifiables sur la page de release._\n' >> /tmp/release-notes.md

      - name: Publier la release avec les assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "v${GITHUB_REF_NAME#v}" \
            --notes-file /tmp/release-notes.md \
            dist/homeserver-v${GITHUB_REF_NAME#v}.tar.gz \
            dist/homeserver-v${GITHUB_REF_NAME#v}.tar.gz.sha256 \
            dist/homeserver-v${GITHUB_REF_NAME#v}.tar.gz.sig
