name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install racine (server)
        run: npm install --no-audit --no-fund

      - name: Typecheck server
        run: npm run typecheck

      - name: Build front
        run: |
          cd front
          npm install --no-audit --no-fund
          npm run build

      - name: Audit dépendances (prod, vulnérabilités highs bloquantes)
        run: npm audit --omit=dev --audit-level=high || echo "⚠ vulnérabilités détectées — voir le log"
